<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>航衡 · 航班异常助手</title><style>

border-bottom:1px solid #edf1ed}.source{font-size:11px;color:#7a8b83;overflow-wrap:anywhere}.chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:17px}.chips button{font-size:12px;padding:6px 11px;border-radius:20px}.dock{position:fixed;bottom:0;width:100%;padding:18px 24px 15px;background:linear-gradient(transparent,#fafbf9 15%)}.composer{max-width:762px;margin:auto;background:white;border:1px solid #d9e4db;border-radius:18px;padding:15px;box-shadow:0 5px 28px #213e3210}.composer textarea{display:block;width:100%;border:0;resize:none;min-height:55px;font:inherit;background:transparent;color:#203b3b}.composer-bottom{display:flex;align-items:center;justify-content:space-between;margin-top:7px}.hint,.fine{font-size:11px;color:#85938b}.fine{text-align:center;margin-top:9px}.hidden{display:none!important}.confirm{background:white;border:1px solid #e0e8df;padding:18px;border-radius:12px;margin-top:12px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{font-size:12px;color:#62786b;display:block}input,select,.confirm textarea{font:inherit;width:100%;padding:7px;border:1px solid #dce6dd;border-radius:6px;color:#274939;background:white}.flags{display:flex;flex-wrap:wrap;gap:7px 18px;margin:12px 0}.flags label{display:flex;gap:5px;align-items:center}.flags input{width:auto}.draft{border-left:3px solid #acc6b4;padding:9px 15px;background:#f1f5ef}.fineleft{font-size:12px;color:#7c8b80}#status{color:#a45f42;font-size:12px;min-height:18px;max-width:762px;margin:auto}@media(max-width:600px){header{padding:0 18px}.brand span{display:none}h1{font-size:25px}.welcome{padding-top:55px}main{padding-left:20px;padding-right:20px}.dock{padding-left:12px;padding-right:12px}.hint{display:none}.composer-bottom{justify-content:flex-end}.fields{grid-template-columns:1fr}.user{max-width:95%}}
</style></head><body><header><div class="brand">航衡<span>航班异常助手</span></div><div><button id="save" class="textbutton">保存对话</button><button id="reset" class="textbutton">新对话 ＋</button></div></header><main><section id="welcome" class="welcome"><div class="mark" aria-hidden="true">↗</div><h1>发生了什么？一起理清下一步。</h1><p class="sub">描述机场的天气或运行异常，我会帮你判断风险、解释依据并整理建议。</p><div class="examples" id="examples"></div></section><section id="chat" class="conversation" aria-live="polite" aria-label="与航衡的对话"></section></main><div class="dock"><div id="status" role="status"></div><form id="composer" class="composer"><textarea id="input" aria-label="描述事件或继续提问" placeholder="例如：海陵机场未来六小时有强降雨，目前没有延误通知，该先做什么？"></textarea><div class="composer-bottom"><span class="hint">Enter 发送 · Shift + Enter 换行 · 请勿输入个人信息</span><button class="primary" type="submit">发送 ↑</button></div></form><div id="connection" class="fine"></div><div class="fine">教学模拟 · 对话及相关机场资料会发送至 DeepSeek API · 不接入实时航班系统 · 运行决定与通知需人工审核</div></div><script src="app.js"></script></body></html>
